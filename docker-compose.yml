services:
  postgis:
    image: postgis/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrisuit}
      POSTGRES_USER: ${POSTGRES_USER:-agrisuit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT count(*) FROM public.crop_predictions' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/geoserver/web/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgis_data:
  geoserver_data:
